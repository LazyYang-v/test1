[project]
name = "agentforge"
version = "0.1.0"
description = "AgentForge P0 platform (walking skeleton)"
requires-python = ">=3.12"
dependencies = [
    "agentforge-api",
    "agentforge-core",
    "agentforge-harness",
    "agentforge-runtime",
    "agentforge-worker",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
agentforge-api = { workspace = true }
agentforge-core = { workspace = true }
agentforge-harness = { workspace = true }
agentforge-runtime = { workspace = true }
agentforge-worker = { workspace = true }

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that run against a real PostgreSQL started via Docker",
]
