services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge-local-bootstrap}
      POSTGRES_DB: agentforge
      AGENTFORGE_MIGRATOR_DB_PASSWORD: ${AGENTFORGE_MIGRATOR_DB_PASSWORD:-agentforge-local-migrator}
      AGENTFORGE_REGISTRY_DB_PASSWORD: ${AGENTFORGE_REGISTRY_DB_PASSWORD:-agentforge-local-registry}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    build: .
    command: ["/app/.venv/bin/agentforge-migrate"]
    environment:
      AGENTFORGE_MIGRATOR_DSN: postgresql://agentforge_migrator:${AGENTFORGE_MIGRATOR_DB_PASSWORD:-agentforge-local-migrator}@postgres:5432/agentforge
      AGENTFORGE_MIGRATOR_DB_PASSWORD: ${AGENTFORGE_MIGRATOR_DB_PASSWORD:-agentforge-local-migrator}
      AGENTFORGE_REGISTRY_DB_PASSWORD: ${AGENTFORGE_REGISTRY_DB_PASSWORD:-agentforge-local-registry}
      AGENTFORGE_API_DB_PASSWORD: ${AGENTFORGE_API_DB_PASSWORD:-agentforge-local-api}
      AGENTFORGE_WORKER_DB_PASSWORD: ${AGENTFORGE_WORKER_DB_PASSWORD:-agentforge-local-worker}
      AGENTFORGE_BUSINESS_RO_DB_PASSWORD: ${AGENTFORGE_BUSINESS_RO_DB_PASSWORD:-agentforge-local-business-ro}
      AGENTFORGE_EVAL_DB_PASSWORD: ${AGENTFORGE_EVAL_DB_PASSWORD:-agentforge-local-eval}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      AGENTFORGE_API_DB_DSN: postgresql://agentforge_api:${AGENTFORGE_API_DB_PASSWORD:-agentforge-local-api}@postgres:5432/agentforge
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${AGENTFORGE_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${AGENTFORGE_WEB_PORT:-3000}:8080"
    environment:
      API_UPSTREAM: ${AGENTFORGE_API_UPSTREAM:-api:8000}
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101
      - /tmp:uid=101,gid=101
      - /var/log/nginx:uid=101,gid=101

  worker:
    build: .
    command: ["/app/.venv/bin/agentforge-worker"]
    environment:
      AGENTFORGE_WORKER_DB_DSN: postgresql://agentforge_worker:${AGENTFORGE_WORKER_DB_PASSWORD:-agentforge-local-worker}@postgres:5432/agentforge
      AGENTFORGE_BUSINESS_RO_DB_DSN: postgresql://agentforge_business_ro:${AGENTFORGE_BUSINESS_RO_DB_PASSWORD:-agentforge-local-business-ro}@postgres:5432/agentforge
      AGENTFORGE_BUSINESS_RO_STATEMENT_TIMEOUT_MS: ${AGENTFORGE_BUSINESS_RO_STATEMENT_TIMEOUT_MS:-3000}
      AGENTFORGE_WORKER_ID: ${AGENTFORGE_WORKER_ID:-worker-1}
      AGENTFORGE_HEARTBEAT_INTERVAL_SECONDS: ${AGENTFORGE_HEARTBEAT_INTERVAL_SECONDS:-5}
      AGENTFORGE_LEASE_SECONDS: ${AGENTFORGE_LEASE_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
