services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge-local-bootstrap}
      POSTGRES_DB: agentforge
      AGENTFORGE_MIGRATOR_DB_PASSWORD: ${AGENTFORGE_MIGRATOR_DB_PASSWORD:-agentforge-local-migrator}
      AGENTFORGE_REGISTRY_DB_PASSWORD: ${AGENTFORGE_REGISTRY_DB_PASSWORD:-agentforge-local-registry}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    build: .
    command: ["/app/.venv/bin/agentforge-migrate"]
    environment:
      AGENTFORGE_MIGRATOR_DSN: postgresql://agentforge_migrator:${AGENTFORGE_MIGRATOR_DB_PASSWORD:-agentforge-local-migrator}@postgres:5432/agentforge
      AGENTFORGE_MIGRATOR_DB_PASSWORD: ${AGENTFORGE_MIGRATOR_DB_PASSWORD:-agentforge-local-migrator}
      AGENTFORGE_REGISTRY_DB_PASSWORD: ${AGENTFORGE_REGISTRY_DB_PASSWORD:-agentforge-local-registry}
      AGENTFORGE_API_DB_PASSWORD: ${AGENTFORGE_API_DB_PASSWORD:-agentforge-local-api}
      AGENTFORGE_WORKER_DB_PASSWORD: ${AGENTFORGE_WORKER_DB_PASSWORD:-agentforge-local-worker}
      AGENTFORGE_BUSINESS_RO_DB_PASSWORD: ${AGENTFORGE_BUSINESS_RO_DB_PASSWORD:-agentforge-local-business-ro}
      AGENTFORGE_EVAL_DB_PASSWORD: ${AGENTFORGE_EVAL_DB_PASSWORD:-agentforge-local-eval}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    # Deterministic dataset generation and load are idempotent: the loader is
    # a no-op once the frozen snapshot is complete, and the content hash must
    # stay stable across environments.
    command: ["/bin/sh", "-c", "agentforge-dataset /tmp/business.jsonl && agentforge-seed /tmp/business.jsonl"]
    environment:
      AGENTFORGE_MIGRATOR_DSN: postgresql://agentforge_migrator:${AGENTFORGE_MIGRATOR_DB_PASSWORD:-agentforge-local-migrator}@postgres:5432/agentforge
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    environment:
      AGENTFORGE_API_DB_DSN: postgresql://agentforge_api:${AGENTFORGE_API_DB_PASSWORD:-agentforge-local-api}@postgres:5432/agentforge
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    ports:
      - "${AGENTFORGE_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${AGENTFORGE_WEB_PORT:-3000}:8080"
    environment:
      API_UPSTREAM: ${AGENTFORGE_API_UPSTREAM:-api:8000}
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101
      - /tmp:uid=101,gid=101
      - /var/log/nginx:uid=101,gid=101

  worker:
    build: .
    command: ["/app/.venv/bin/agentforge-worker"]
    environment:
      AGENTFORGE_WORKER_DB_DSN: postgresql://agentforge_worker:${AGENTFORGE_WORKER_DB_PASSWORD:-agentforge-local-worker}@postgres:5432/agentforge
      AGENTFORGE_BUSINESS_RO_DB_DSN: postgresql://agentforge_business_ro:${AGENTFORGE_BUSINESS_RO_DB_PASSWORD:-agentforge-local-business-ro}@postgres:5432/agentforge
      AGENTFORGE_BUSINESS_RO_STATEMENT_TIMEOUT_MS: ${AGENTFORGE_BUSINESS_RO_STATEMENT_TIMEOUT_MS:-3000}
      AGENTFORGE_WORKER_ID: ${AGENTFORGE_WORKER_ID:-worker-1}
      AGENTFORGE_HEARTBEAT_INTERVAL_SECONDS: ${AGENTFORGE_HEARTBEAT_INTERVAL_SECONDS:-5}
      AGENTFORGE_LEASE_SECONDS: ${AGENTFORGE_LEASE_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  # Optional observability stack: started only with
  #   docker compose --profile observability up
  # Default cold start never requires these services. Enable OTLP export in
  # the API/Worker with AGENTFORGE_OTEL_ENABLED=true and point
  # AGENTFORGE_OTEL_EXPORTER_OTLP_ENDPOINT at tempo:4318.
  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${AGENTFORGE_GRAFANA_PORT:-3001}:3000"
    profiles: ["observability"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    profiles: ["observability"]

volumes:
  postgres_data:
  tempo_data:
  prometheus_data:
  grafana_data:
