[project]
name = "agentforge-runtime"
version = "0.1.0"
description = "AgentForge runtime: task claims, leases, fencing, step replay, and evidence persistence"
requires-python = ">=3.12"
dependencies = [
    "agentforge-core",
    "asyncpg>=0.29",
]

[tool.uv.sources]
agentforge-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_runtime"]
