[project]
name = "agentforge-core"
version = "0.1.0"
description = "AgentForge core: contracts, schema version, migration tooling"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
agentforge-migrate = "agentforge_core.migrations:main"
agentforge-registry = "agentforge_core.registry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_core"]
