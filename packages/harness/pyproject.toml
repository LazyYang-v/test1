[project]
name = "agentforge-harness"
version = "0.1.0"
description = "AgentForge thin harness: model adapters, schemas, tool gateway, report validation"
requires-python = ">=3.12"
dependencies = [
    "agentforge-core",
    "jsonschema>=4.23,<5",
]

[tool.uv.sources]
agentforge-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_harness"]
