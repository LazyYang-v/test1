[project]
name = "agentforge-worker"
version = "0.1.0"
description = "AgentForge P0 worker: claims tasks and runs the linear four-node analysis graph"
requires-python = ">=3.12"
dependencies = [
    "agentforge-core",
    "agentforge-harness",
    "agentforge-runtime",
    "asyncpg>=0.29",
    "langgraph>=1.2,<2",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
]

[tool.uv.sources]
agentforge-core = { workspace = true }
agentforge-harness = { workspace = true }
agentforge-runtime = { workspace = true }

[project.scripts]
agentforge-worker = "agentforge_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_worker"]
