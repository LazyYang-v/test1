[project]
name = "agentforge-api"
version = "0.1.0"
description = "AgentForge FastAPI control plane"
requires-python = ">=3.12"
dependencies = [
    "agentforge-core",
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "uvicorn>=0.30",
]

[tool.uv.sources]
agentforge-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_api"]
